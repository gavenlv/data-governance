[project]
name = "dg"
version = "0.1.0"
description = "通用数据治理平台（Data Governance Platform）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-bdd>=8.1",
    "httpx>=0.27",
]
lineage = [
    "sqlglot>=25.0",
]

[project.scripts]
dgctl = "dg.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "external: 依赖外部基础设施（缺失则跳过）",
    "clickhouse: 需要 ClickHouse 127.0.0.1:8123",
    "mongodb: 需要 MongoDB 127.0.0.1:27018",
    "superset: 需要 Superset 127.0.0.1:18089",
    "bigquery: BigQuery 分组（缺凭据错误始终可断言，不跳过）",
    "dbt: dbt manifest 连接器（仓库内夹具，不跳过）",
    "chrome: 需要无头 Chrome/Edge",
    "psql: 需要 psql 二进制构造合成历史",
]
