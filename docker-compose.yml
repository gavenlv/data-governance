# ---------------------------------------------------------------------------
# 通用数据治理平台 —— 单机部署（docs/07 §4「单机版 / Dev」）
#
#   docker compose up -d
#   UI:  http://127.0.0.1:8080/
#   API: http://127.0.0.1:8080/docs
#
# 说明：
#   - 真相源是 PostgreSQL（ADR-001）；平台自身不存储业务数据（控制面/数据面分离）
#   - 首次启动会自动执行 `dgctl init` 建表（幂等）
#   - 生产形态（Kafka/OpenSearch/多副本）见 docs/07 §4 的"标准版"，本文件是 Dev 形态
# ---------------------------------------------------------------------------
name: dg-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: dg-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dg_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-dg}
      # 中文检索需要分词扩展时，可换用带 zhparser/pg_jieba 的镜像（见 docs/21 §4 限制 2）
    ports:
      - "${POSTGRES_PORT:-25432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dg} -d ${POSTGRES_DB:-dg}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dg-platform:${DG_VERSION:-0.1.0}
    container_name: dg-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Java 控制面要 JDBC URL（不是 SQLAlchemy 的 postgresql+psycopg2://）。
      # 用户名/密码分开给 —— 混在 URL 里时，密码含特殊字符会被错误解析。
      DG_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dg}
      DG_DATABASE_USER: ${POSTGRES_USER:-dg}
      DG_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-dg_local_password}
      DG_NAMESPACE: ${DG_NAMESPACE:-prod}
      DG_TENANT: ${DG_TENANT:-default}
      DG_MODEL_DIR: /app/model
      DG_SQL_DIR: /app/sql
      DG_WEB_DIST: /app/web/dist
      # 认证：static（开发/内网）或 jwt（生产对接 OIDC/SSO，见 docs/22 Batch 9）。
      # 生产建议同时设置 SPRING_PROFILES_ACTIVE=prod —— 它启用严格默认值
      # （关闭 /docs、actuator 只留 health、错误响应不带内部信息、开启 HSTS），
      # 并让「用内置开发令牌启动」直接失败，而不是悄悄跑起来。
      DG_AUTH_MODE: ${DG_AUTH_MODE:-static}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      DG_ADMIN_TOKEN: ${DG_ADMIN_TOKEN:-}
      DG_STEWARD_TOKEN: ${DG_STEWARD_TOKEN:-}
      DG_READER_TOKEN: ${DG_READER_TOKEN:-}
      DG_JWT_ISSUER: ${DG_JWT_ISSUER:-}
      DG_JWT_AUDIENCE: ${DG_JWT_AUDIENCE:-}
      DG_JWT_JWKS_URI: ${DG_JWT_JWKS_URI:-}
      DG_JWT_JWKS_FILE: ${DG_JWT_JWKS_FILE:-}
      DG_JWT_JWKS_JSON: ${DG_JWT_JWKS_JSON:-}
      DG_JWT_ROLES_CLAIM: ${DG_JWT_ROLES_CLAIM:-roles}
      DG_SECURITY_HSTS_MAX_AGE: ${DG_SECURITY_HSTS_MAX_AGE:-0}
      DG_SECRET_KEY: ${DG_SECRET_KEY:-}
      DG_API_PORT: "8080"
    ports:
      - "${DG_API_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  pgdata:
