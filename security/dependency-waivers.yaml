# ============================================================================
# 依赖漏洞豁免登记（NFR-SEC-01 的例外台账，docs/23 §5）
#
# 规则：
#   1. **能修就修、能换就换**：豁免是最后手段，不是常规操作；
#   2. 每条豁免必须写清 reason（为什么不能修）+ owner（谁负责）+ expires（到期日）；
#   3. 到期未续期 → `tools/dependency_audit.py` 把它**重新算作阻断项**；
#   4. 豁免只对**指定的 CVE/GHSA ID + 包**生效，不做"整包豁免"；
#   5. reason 里必须写清**可达性证据**（为什么这个漏洞在我们这里打不到），
#      而不是只写"风险可接受" —— 后者无法被复核。
# ============================================================================
apiVersion: dg.security/v1
kind: DependencyWaivers

waivers:
  # ---------------------------------------------------------------------------
  # 首条真实豁免（2026-10-06 登记）。
  #
  # 背景：CRITICAL 且**上游 6.2.x 线尚无修复版本** —— 修复只出现在 Spring
  # Framework 7.0.9（即 Spring Boot 4.x）。按 NFR 的时限要求，CRITICAL 需 7 天内处理；
  # 当"修"与"换"都不可行时，唯一诚实的做法是：把可达性论证清楚、登记带到期日的豁免、
  # 并加一条**守卫测试**让"打不到"这件事可验证而不是口头承诺。
  # ---------------------------------------------------------------------------
  - id: GHSA-pc63-qcmh-9cmg            # CVE-2026-47884：XsltView 的路径限制缺陷
    package: org.springframework:spring-webmvc
    reason: >-
      漏洞要求同时满足两个条件：① 应用使用 XsltView；② 存在 /** 映射且**视图名未显式指定**。
      本平台两个条件都不成立：全仓库没有任何 XsltView / XmlViewResolver / XSLT 引用；
      WebConfig 里的三个视图控制器**全部显式** setViewName("forward:/index.html")。
      上游 6.2.x 线当前没有修复版本（OSV: 6.2.0–6.2.19 last_affected、无 fixed），
      升级到修复版本需要迁移到 Spring Boot 4.x（Spring Framework 7），
      属独立项目（见 docs/23 §8 第 7 条），不适合与漏洞修复混做。
      守卫：dg-api 的 XsltViewReachabilityGuardTest 会在有人引入 XsltView
      或去掉显式视图名时立即失败。
    owner: data-platform-team（需在安全评审会上指派具体负责人）
    expires: 2026-11-05                # 30 天；到期自动重新阻断，届时需复核或续期
    tracking: docs/23 §7.7 / docs/21 §21.5

  # ---------------------------------------------------------------------------
  # 第二条真实豁免（2026-10-24 登记）。
  #
  # 背景与上一条同源：CRITICAL，且 6.2.x 线**同样没有修复版本**（fixed 只在 7.0.9）。
  # 不同的是这条的可达性判断更干净：触发路径是 SSE + 视图 fragment，
  # 而本平台根本不产生流式响应。
  # ---------------------------------------------------------------------------
  - id: GHSA-j9f9-w8pj-32f8            # CVE-2026-47890：SSE 与视图 fragment 的流损坏
    package: org.springframework:spring-webmvc
    reason: >-
      公告写明的触发路径是「Server-Sent Events（SseEmitter / ResponseBodyEmitter）+
      视图 fragment 渲染」：只有用 SSE 逐段渲染视图片段的应用才会走到受损代码。
      本平台是纯 JSON REST + 静态 SPA：全仓库没有任何 SseEmitter / ResponseBodyEmitter /
      StreamingResponseBody / text/event-stream 引用，控制器统一返回 ResponseEntity（JSON），
      不存在流式响应路径，因此打不到这段代码。
      上游 6.2.x 线无修复版本（OSV: 6.2.0–6.2.19 last_affected、无 fixed），
      修复只在 Spring Framework 7.0.9（= Spring Boot 4.x），与上一条同属世代迁移
      （docs/23 §8 第 7 条），不适合与补丁混做。
      守卫：dg-api 的 SseFragmentReachabilityGuardTest 会在有人引入任何 SSE/流式响应 API
      时立即失败，从而让"打不到"这件事始终可验证。
    owner: data-platform-team（需在安全评审会上指派具体负责人）
    expires: 2026-11-23                # 30 天；到期自动重新阻断，届时需复核或续期
    tracking: docs/23 §7.8 / docs/21 §22
