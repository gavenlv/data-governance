# ============================================================================
# 依赖漏洞豁免登记（NFR-SEC-01 的例外台账）
#
# 规则（docs/23 §5）：
#   1. **能修就修、能换就换**：豁免是最后手段，不是常规操作；
#   2. 每条豁免必须写清 reason（为什么不能修）+ owner（谁负责）+ expires（到期日）；
#   3. 到期未续期 → 审计工具把它重新算作阻断项（`tools/dependency_audit.py` 会校验）；
#   4. 豁免只对**指定的 CVE/GHSA ID + 包**生效，不做"整包豁免"。
#
# 当前状态：**无豁免**。所有已发现漏洞都已通过升级修复（见 docs/23 §7）。
# ============================================================================
apiVersion: dg.security/v1
kind: DependencyWaivers

waivers: []
# 示例（仅格式示范，不要照抄进生产）：
# waivers:
#   - id: GHSA-xxxx-xxxx-xxxx          # 必须精确到漏洞编号
#     package: org.example:lib          # 精确到受影响的包
#     reason: "该漏洞路径要求开启 X 特性，本平台不使用；上游承诺 1.2.3 修复"
#     owner: security@example.com
#     expires: 2026-03-31               # 到期后自动重新阻断
#     tracking: "JIRA-SEC-123"
