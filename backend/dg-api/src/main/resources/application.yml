server:
  port: ${DG_API_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: dg-platform-control-plane
  datasource:
    url: ${DG_DATABASE_URL:jdbc:postgresql://localhost:25011/dg}
    username: ${DG_DATABASE_USER:postgres}
    password: ${DG_DATABASE_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
      pool-name: dg-pool
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false
  web:
    resources:
      # 前端构建产物由本服务托管（生产形态单端口）；含 index.html 供 SPA 回退
      static-locations: classpath:/static/,file:${DG_WEB_DIST:../web/dist}/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

# ---------------------------------------------------------------------------
# 平台自身配置（docs/10 §1）
# ---------------------------------------------------------------------------
dg:
  # 模型定义目录（唯一事实源，docs/08 §6）
  model-dir: ${DG_MODEL_DIR:../model}
  # 迁移脚本目录（执行 sql/*.sql，幂等）
  sql-dir: ${DG_SQL_DIR:../sql}
  migrate-on-start: ${DG_MIGRATE_ON_START:true}
  # 前端构建产物目录（web/dist，由本服务托管）
  web-dist: ${DG_WEB_DIST:../web/dist}
  # 检索索引（派生视图，docs/09 §9.3）
  search:
    # 常驻消费者间隔；设 0 = 关闭（此时只能手动 POST /api/v1/index/consume，lag 会持续暴露）
    consume-interval-ms: ${DG_SEARCH_CONSUME_INTERVAL_MS:5000}
    consume-initial-delay-ms: ${DG_SEARCH_CONSUME_INITIAL_DELAY_MS:10000}
    consume-batch-size: ${DG_SEARCH_CONSUME_BATCH_SIZE:500}
  # 采集调度（docs/09 §9.1）
  scheduler:
    enabled: ${DG_SCHEDULER_ENABLED:true}
    poll-interval-ms: ${DG_SCHEDULER_POLL_INTERVAL_MS:30000}
    initial-delay-ms: ${DG_SCHEDULER_INITIAL_DELAY_MS:20000}
  # 数据源凭据加密密钥（Base64 编码的 32 字节 = AES-256-GCM 密钥）
  #   生成：openssl rand -base64 32
  #   刻意不设默认值：未配置时保存数据源连接直接返回 502，
  #   而不是退化成明文存储或"内置弱密钥"——使用者不该以为凭据被加密了而其实没有。
  secret-key: ${DG_SECRET_KEY:}
  # 血缘
  lineage:
    # Python sqlglot 侧车地址；启动方式 python -m dg.cli sidecar。
    # 设空 = 未部署：此时解析接口返回 502 并标注原因，**不**静默返回空血缘（docs/09 §9.2）
    sidecar-url: ${DG_LINEAGE_SIDECAR_URL:http://127.0.0.1:8099}
    sidecar-timeout-seconds: 15
  # 认证（docs/09 §9.7）：static 静态令牌 | disabled 关闭（仅本机开发）
  auth:
    mode: ${DG_AUTH_MODE:static}
    # 静态令牌表：token -> id/name/roles
    tokens:
      - token: ${DG_ADMIN_TOKEN:dev-admin-token}
        id: admin@local
        name: 本地管理员
        roles: [ADMIN]
      - token: ${DG_STEWARD_TOKEN:dev-steward-token}
        id: steward@local
        name: 本地数据管家
        roles: [STEWARD]
      - token: ${DG_READER_TOKEN:dev-reader-token}
        id: reader@local
        name: 本地只读用户
        roles: [READER]

logging:
  level:
    com.datagovernance: INFO
    org.springframework.jdbc.core: WARN
